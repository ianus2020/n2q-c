name: Security regressions
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  anchor:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev
      - name: Real mTLS provider, persistent service and signer failures
        run: python3 -m unittest discover -s tests -p test_anchor_service.py -v
  cryptanalysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - name: Exact components and reproducible experiments
        run: |
          mkdir -p /tmp/n2q-cryptanalysis
          python3 tools/cryptanalysis/exact.py > /tmp/n2q-cryptanalysis/exact.json
          cargo run --release --locked --manifest-path tools/cryptanalysis/Cargo.toml --bin audit -- full > /tmp/n2q-cryptanalysis/experiments.jsonl
      - name: Verify archived audit arithmetic
        run: |
          python3 tools/cryptanalysis/summarize.py docs/audit/2026-10-19 > /tmp/n2q-archived-summary.json
          cmp docs/audit/2026-10-19/summary.json /tmp/n2q-archived-summary.json
      - name: Record cryptanalysis inputs
        if: always()
        env:
          N2Q_VERIFICATION_STATUS: ${{ job.status }}
          N2Q_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/verification-record.py --job cryptanalysis --output /tmp/n2q-cryptanalysis-evidence.json
      - name: Retain experimental results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-cryptanalysis
          path: |
            /tmp/n2q-cryptanalysis/
            /tmp/n2q-cryptanalysis-evidence.json
          retention-days: 14
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      - run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - run: brew install php
      - run: scripts/check.sh
      - name: Record native verification inputs
        if: always()
        env:
          N2Q_VERIFICATION_STATUS: ${{ job.status }}
          N2Q_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/verification-record.py --job native --output /tmp/n2q-native-evidence.json
      - name: Retain native verification record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-native
          path: /tmp/n2q-native-evidence.json
          retention-days: 14
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown && rustup default 1.96.1
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: scripts/build-web.sh
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Browser regressions
        run: |
          python3 scripts/serve-web.py --port 8765 > /tmp/n2q-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:web
      - name: Record web verification inputs
        if: always()
        env:
          N2Q_VERIFICATION_STATUS: ${{ job.status }}
          N2Q_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/verification-record.py --job web --output /tmp/n2q-web-evidence.json
      - name: Retain web verification record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-web
          path: /tmp/n2q-web-evidence.json
          retention-days: 14
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.96.1 --profile minimal
      - run: rustup toolchain install nightly-2026-10-18 --profile minimal
      - run: cargo +1.96.1 install cargo-fuzz --version 0.13.2 --locked
      - run: scripts/fuzz-smoke.sh
      - name: Retain crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Record fuzz verification inputs
        if: always()
        env:
          N2Q_VERIFICATION_STATUS: ${{ job.status }}
          N2Q_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/verification-record.py --job fuzz --output /tmp/n2q-fuzz-evidence.json
      - name: Retain fuzz verification record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-fuzz
          path: /tmp/n2q-fuzz-evidence.json
          retention-days: 14
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - run: cargo +1.96.1 install cargo-audit --version 0.22.2 --locked --no-default-features
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.8'
      - run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - run: npm ci --ignore-scripts
      - run: scripts/dependency-audit.sh /tmp/n2q-dependency-audit
      - name: Record dependency verification inputs
        if: always()
        env:
          N2Q_VERIFICATION_STATUS: ${{ job.status }}
          N2Q_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/verification-record.py --job dependencies --output /tmp/n2q-dependency-evidence.json
      - name: Retain dependency reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-dependencies
          path: |
            /tmp/n2q-dependency-audit/
            /tmp/n2q-dependency-evidence.json
          retention-days: 14
