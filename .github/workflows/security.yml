name: Security regressions
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
      - run: rustup toolchain install 1.96.1 --profile minimal && rustup default 1.96.1
      - run: brew install php
      - run: scripts/check.sh
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown && rustup default 1.96.1
      - run: cargo install wasm-pack --version 0.13.1 --locked
      - run: scripts/build-web.sh
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Browser regressions
        run: |
          python3 scripts/serve-web.py --port 8765 > /tmp/n2q-http.log 2>&1 &
          server=$!
          trap 'kill "$server"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          npm run test:web
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: rustup toolchain install 1.96.1 --profile minimal
      - run: rustup toolchain install nightly-2026-10-18 --profile minimal
      - run: cargo +1.96.1 install cargo-fuzz --version 0.13.2 --locked
      - run: scripts/fuzz-smoke.sh
      - name: Retain crashing inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7
